# ── 编码与 locale 钉死 ────────────────────────────────────────────────────────
# 本项目源码含字面 CJK(番茄/红果/云朵/获取推荐用户数据成功 等定位串),而 squemaFQH
# 有 13 处 mojibake `????` 的教训:它是在注释已经损坏之后才补上这套钉死的,无法恢复。
# daemon 的 jvmargs 里也要重复一遍,否则 forked 编译进程仍是平台默认编码。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8 -Duser.language=en -Duser.country=US
systemProp.file.encoding=UTF-8
systemProp.sun.jnu.encoding=UTF-8
systemProp.user.language=en
systemProp.user.country=US

android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official
